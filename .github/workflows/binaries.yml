name: binaries

# Builds the accelerated helper binaries and attaches them to a release.
#
# Portability note (why no -march=native anywhere):
#
#   a NATIVE-targeted binary
#   built that way runs only on machines with at least the builder's
#   instruction set - it SIGILLs elsewhere - so it is not distributable. A
#   published artefact has to be portable, and portable is what this workflow
#   guarantees.
#
#   The cost is measured, not assumed, and it is stage-dependent
#   (paper/benchmarks/results/*.csv, 1BL8, 50 frames, medians of 3):
#     * surface stage:  -O2 is 2.04x (circular) / 2.91x (Connolly) faster
#     * HOLE calculation stage: -O2 is 4.3% SLOWER
#     * output is byte-identical either way (sph md5 matches)
#
#   So: use these to try the plugin, and run native/build.sh locally
#   (default CFLAGS=-O2) when the surface stage is what you are waiting on.
#   Nothing about the RESULTS changes - only how long they take.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built assets to (leave empty to only build)"
        required: false
        default: ""

# Attaching assets to a release WRITES to the repo; the default GITHUB_TOKEN
# is read-only since GitHub tightened workflow permissions, and the first
# release run failed exactly there ("Resource not accessible by integration")
# after both OS builds had already succeeded.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x86_64
          - os: macos-latest
            tag: macos-arm64
          - os: windows-latest
            tag: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # Windows builds under MSYS2/MinGW-w64 - the exact toolchain the
      # portability fixes were developed and verified against (the stdin
      # freopen fix, .exe-aware discovery). Like macOS, the Windows bundle is
      # the three C tools; the Fortran pair is a local build (gfortran via
      # MSYS2, see docs/installation.md).
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      # OPT is passed EXPLICITLY. Both build scripts default to -O2 from their
      # own OPT="${OPT:--O2}", so calling them bare published -O2 binaries while
      # this workflow's header, docs/installation.md and packaging/make_zip.sh
      # all state -O0. The policy is deliberate - a published artefact should be
      # the one whose provenance is stated - so the flag belongs here, not in a
      # comment.
      - name: Build the C tools (portable, not native-targeted)
        if: runner.os != 'Windows'
        working-directory: native
        env:
          OPT: "-O0"
        run: sh build.sh

      - name: Build the C tools (Windows, MinGW-w64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: native
        env:
          OPT: "-O0"
        run: sh build.sh

      # Linux additionally gets the FULL acceleration: the pinned HOLE 2 source
      # is cloned, our Fortran patches applied, and the accelerated hole +
      # sph_process built (build-vmdpathfinder-optimized.sh, at -O0 like the
      # rest of the bundle - the script itself also refuses -march=native for
      # FP-identity reasons). The ACCELERATION here is the Fortran patches
      # (parallel CONNOLLY, fast CAPSULE), which -O0 keeps; -O2 is a separate
      # axis and belongs to a local build.
      # macOS runners have no gfortran by default, so the mac bundle stays the
      # three C tools - stated in its README.
      - name: Build the patched HOLE pair (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          OPT="-O0" sh native/build-vmdpathfinder-optimized.sh "" "$PWD/accel_out"

      - name: Stage the artefacts with their provenance
        shell: bash
        run: |
          d="vmdpathfinder-binaries-${{ matrix.tag }}"
          mkdir -p "$d"
          # MinGW-w64 always appends .exe; the plugin's discovery is .exe-aware
          # (_find_exe), so the bundle ships the suffixed names as built.
          x=""; [ -f native/sos_triangle_fast.exe ] && x=".exe"
          if [ -d accel_out ]; then
            # full set: the fast sos_triangle under its DEPLOYED name, the
            # patched Fortran pair, and the manifest the plugin's acceleration
            # indicator reads.
            cp accel_out/hole accel_out/sph_process accel_out/sos_triangle \
               accel_out/mole_tunnel_engine "$d/"
            cp accel_out/vmdpathfinder_accel.manifest "$d/"
          else
            cp "native/sos_triangle_fast$x" "$d/sos_triangle$x"
            cp "native/mole_tunnel_engine$x" "$d/"
          fi
          cp "native/hydro_project$x"   "$d/"
          # nm_search, conn_lobes and mesh_csg ride inside sos_triangle
          # (sos_triangle --nm-search|--mesh|--conn-lobes); nothing else ships.
          # a working radius file so a from-zip user can run without a separate
          # HOLE install (HOLE 2's own simple.rad, Apache-2.0)
          mkdir -p "$d/rad"
          cp vmdpathfinder/tests/fixtures/simple.rad "$d/rad/"
          cp vmdpathfinder/rad/martini2.rad vmdpathfinder/rad/martini3.rad "$d/rad/"
          # sos_triangle_fast is MODIFIED Apache-2.0 HOLE code: distributing
          # the binary requires the Apache licence text and NOTICE to travel
          # with it, not only the project's own MIT licence.
          cp LICENSE        "$d/LICENSE"
          cp native/LICENSE "$d/LICENSE-Apache-2.0"
          cp native/NOTICE  "$d/NOTICE"
          {
            echo "VMDPathFinder portable binaries - ${{ matrix.tag }}"
            echo
            echo "Built from $GITHUB_SHA."
            echo
            echo "Included:"
            if [ -d accel_out ]; then
              echo "  hole                HOLE 2 with the VMDPathFinder acceleration patches"
              echo "  sph_process         patched (parallel surface cull)"
              echo "  sos_triangle        the fast triangulation, the marching-cubes mesher,"
              echo "                      the Nelder-Mead search and the Connolly classifier"
              echo "  mole_tunnel_engine  tunnel search"
              echo "  hydro_project       hydration acceleration"
              echo "  vmdpathfinder_accel.manifest  read by the plugin's acceleration indicator"
              echo "  rad/simple.rad      HOLE radius file, so no separate install is needed"
              echo "  rad/martini2.rad, rad/martini3.rad  bead radii for Martini systems"
            else
              echo "  sos_triangle        the fast triangulation (drop-in for stock)"
              echo "  mole_tunnel_engine  tunnel search"
              echo "  hydro_project       hydration acceleration"
              echo "  rad/simple.rad      HOLE radius file"
              echo "  rad/martini2.rad, rad/martini3.rad  bead radii for Martini systems"
              echo
              echo "  The accelerated Fortran pair (hole, sph_process) is not"
              echo "  prebuilt for this platform - build locally (macOS: gfortran"
              echo "  via Homebrew; Windows: MSYS2/MinGW-w64, see"
              echo "  docs/installation.md):"
              echo "      ./native/build-vmdpathfinder-optimized.sh"
            fi
            echo
            echo "Unpack this folder next to the plugin zip's install.sh (as"
            echo "./binaries/ or under its unpacked name) and the installer"
            echo "points VMDPathFinder at it - or select the files by hand under"
            echo "File > Settings."
            echo "For the complete optimized binary set, build locally from the"
            echo "matching VMDPathFinder source release:"
            echo
            echo "    ./native/build-vmdpathfinder-optimized.sh"
          } > "$d/README.txt"
          tar czf "$d.tar.gz" "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: vmdpathfinder-binaries-${{ matrix.tag }}
          path: vmdpathfinder-binaries-${{ matrix.tag }}.tar.gz

      # A release gate that CAN run here. The full scientific gate
      # (VMDPATHFINDER_RELEASE=1 ./run_tests.sh) needs VMD and an X display, so
      # it cannot run on these runners - and treating a SKIP as a pass is
      # exactly what that flag exists to prevent. What runs headless runs here,
      # and the notes say plainly that the full gate is a local step, so its
      # absence is stated rather than implied by silence.
      - name: Release gate (the parts that run without VMD)
        if: runner.os == 'Linux'
        run: |
          ./tests/unit/run_unit_tests.sh
          ./vmdpathfinder/tests/test_release_integrity.sh
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: vmdpathfinder-binaries-${{ matrix.tag }}.tar.gz

  plugin-zip:
    # The headline downloads: ONE zip per OS containing the plugin package
    # PLUS that OS's compiled binaries as vmdpathfinder/binaries/ (the layout
    # install.sh detects). The bare plugin-only zip is kept as the
    # any-other-platform fallback - it runs everywhere on the built-in Tcl
    # engines.
    name: plugin zip (+ per-OS bundles)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds packaging/vmdpathfinder.zip fresh from `git ls-files` at this commit -
      # nothing checked in to rebuild from and nothing that can drift, since
      # there is only one source tree. This also runs the release-integrity
      # checks against what it just built (integrity always checks the
      # plugin-only build; the bundles below add binaries/ on top of the
      # exact staging the checks passed).
      - name: Build and verify the plugin zip
        run: sh vmdpathfinder/tests/test_release_integrity.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: vmdpathfinder-binaries-*
          path: wheels
          merge-multiple: true
      - name: Assemble one complete zip per OS
        run: |
          for tag in linux-x86_64 macos-arm64 windows-x86_64; do
            tb="wheels/vmdpathfinder-binaries-$tag.tar.gz"
            [ -f "$tb" ] || { echo "no wheel for $tag (its build failed?) - skipping"; continue; }
            rm -rf wheels/unpack && mkdir wheels/unpack
            tar xzf "$tb" -C wheels/unpack
            VMDPATHFINDER_BINARIES_DIR="$(echo wheels/unpack/vmdpathfinder-binaries-$tag)"               sh packaging/make_zip.sh
            mv packaging/vmdpathfinder.zip "vmdpathfinder-$tag.zip"
          done
          # rebuild the bare plugin-only zip last so the artifact below is clean
          sh packaging/make_zip.sh
          ls -la vmdpathfinder-*.zip packaging/vmdpathfinder.zip
      # Only the per-OS bundles are published - a plugin-only zip proved
      # redundant (anyone on another platform clones the repo, and the
      # bundles degrade gracefully: the binaries are optional at runtime).
      # The bare build above still runs because the integrity checks
      # validate the exact staging the bundles are layered onto.
      - uses: actions/upload-artifact@v4
        with:
          name: vmdpathfinder-plugin
          path: vmdpathfinder-*.zip
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: vmdpathfinder-*.zip
